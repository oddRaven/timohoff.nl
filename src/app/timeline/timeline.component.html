<div class="selector" [style.left.px]="selectorLeft"></div>

@for (phase of timeline.phases; track $index; let phaseIndex = $index) {
    <div class="phase">
        <div class="phase-title" [class]="['background-' + phase.color]">{{ phase.title }}</div>
        <div class="phase-content">
            @for (waypoint of phase.waypoints; track $index; let waypointIndex = $index) {
                <div [class]="['waypoint', phaseIndex == 0 && waypointIndex == 0 ? 'first': '']" (click)="select(waypoint)" (keyup.enter)="select(waypoint)">
                    <div class="waypoint-title">{{ waypoint.title }}</div>
                    <div class="waypoint-icon">
                        <img [src]="waypoint.image_source" [ngClass]="[waypoint.is_bound ? 'border-' + phase.color : '']" tabindex="0" />
                    </div>
                    @if (phaseIndex !== timeline.phases.length - 1 || waypointIndex !== phase.waypoints.length - 1) {
                        <div class="waypoint-connector"></div>
                    }
                </div>
            }
        </div>
    </div>
}
