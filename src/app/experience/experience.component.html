@if (experience) {
    <section>
        <header>
            <img class="icon" [src]="experience.image_source" [class]="[experience.color ? 'border-' + experience.color : '']"/>
            <h2 class="title">{{ experience.title }}</h2>
        </header>

        <app-experience-overview [experience]="experience"></app-experience-overview>
    </section>
}
